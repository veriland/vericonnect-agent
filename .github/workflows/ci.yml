name: CI

# Runs on every pull request targeting main. Builds the project on Windows
# and Linux, runs the core self-test, enforces clang-format style and checks
# the design rules in DESIGN.md. Merges into main are gated on this workflow
# succeeding - except the clang-tidy job, which reports without blocking.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 20.1.7
        # PyPI ships a version-pinned clang-format wheel with the native
        # binary bundled. Pinning the exact version keeps the CI check
        # byte-for-byte consistent with the version contributors run
        # locally (via LLVM 20).
        run: pip install --user clang-format==20.1.7

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp')
          if [ -z "$files" ]; then
            echo "No C/C++ sources to check."
            exit 0
          fi
          # Skip generated resource files.
          files=$(echo "$files" | grep -vE '(^|/)(build|cmake/version\.rc\.in)($|/)' || true)
          # --dry-run --Werror: prints the offending diff and exits non-zero.
          if ! clang-format --dry-run --Werror $files; then
            echo ""
            echo "Run 'clang-format -i <file>' locally to fix, or apply the"
            echo "repo style with:  git ls-files '*.cpp' '*.h' '*.hpp' | xargs clang-format -i"
            exit 1
          fi

  design-rules:
    name: design rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      # DESIGN.md section 1: core/ is the portable layer. It must not reach
      # into the per-OS layer, the plugin layer or the hosting layer.
      - name: core/ does not depend on platform/, adapters/ or apps/
        run: |
          set -euo pipefail
          # Only source and headers - core/CMakeLists.txt deliberately
          # compiles the matching platform/ sources into the vc_core target.
          files=$(git ls-files 'core/*.h' 'core/*.cpp')
          if grep -nE '^[[:space:]]*#[[:space:]]*include[[:space:]]*["<](\.\./)*(platform|adapters|apps)/' $files; then
            echo "::error::core/ must not include from platform/, adapters/ or apps/ (DESIGN.md section 1)"
            exit 1
          fi
          echo "OK: core/ includes nothing from platform/, adapters/ or apps/"

      # DESIGN.md section 1 (insulation): a core/ header must compile on its
      # own against nothing but the standard library - no platform SDK, and no
      # reliance on being included after something else.
      - name: core/ headers compile standalone
        run: |
          set -euo pipefail
          fail=0
          for h in core/include/vc/*.h; do
            if ! g++-13 -std=c++23 -Icore/include -fsyntax-only -x c++ "$h" 2>/tmp/hdr.err; then
              echo "::error file=$h::header does not compile standalone (DESIGN.md section 1)"
              cat /tmp/hdr.err
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "OK: every core/ header compiles standalone"
          fi
          exit $fail

  clang-tidy:
    name: clang-tidy (non-blocking)
    runs-on: ubuntu-latest
    # Advisory for now: the check set in .clang-tidy is being worked down, so
    # findings are reported but do not fail the PR. Remove once it is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++-13 clang-tidy libssl-dev

      - name: Configure (export compile commands)
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on our sources
        run: |
          set -euo pipefail
          files=$(git ls-files 'core/*.cpp' 'adapters/*.cpp' 'apps/*.cpp' 'platform/posix/*.cpp')
          clang-tidy -p build $files

  build-test:
    name: build & self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: vs2022
            build-flags: --config Release
            selftest: build/bin/Release/vc-selftest.exe
          - os: ubuntu-latest
            preset: ""
            build-flags: ""
            selftest: build/bin/vc-selftest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++-13

      - name: Configure (Windows / MSVC via preset)
        if: matrix.os == 'windows-2022'
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure (Linux / GCC 13)
        if: matrix.os == 'ubuntu-latest'
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build ${{ matrix.build-flags }} --parallel

      - name: Run self-test
        run: ${{ matrix.selftest }}
