name: CI

# Runs on every pull request targeting main. Builds the project on Windows
# and Linux, runs the core self-test, enforces clang-format style and checks
# the design rules in DESIGN.md. Merges into main are gated on this workflow
# succeeding.
#
# The clang-tidy job is clean and blocking. It analyses the library only -
# core/, adapters/ and platform/posix/ - not apps/, which are hosting glue and
# the test binary; see .clang-tidy and DESIGN.md section 7.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 20.1.7
        # PyPI ships a version-pinned clang-format wheel with the native
        # binary bundled. Pinning the exact version keeps the CI check
        # byte-for-byte consistent with the version contributors run
        # locally (via LLVM 20).
        run: pip install --user clang-format==20.1.7

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp')
          if [ -z "$files" ]; then
            echo "No C/C++ sources to check."
            exit 0
          fi
          # Skip generated resource files.
          files=$(echo "$files" | grep -vE '(^|/)(build|cmake/version\.rc\.in)($|/)' || true)
          # --dry-run --Werror: prints the offending diff and exits non-zero.
          if ! clang-format --dry-run --Werror $files; then
            echo ""
            echo "Run 'clang-format -i <file>' locally to fix, or apply the"
            echo "repo style with:  git ls-files '*.cpp' '*.h' '*.hpp' | xargs clang-format -i"
            exit 1
          fi

  design-rules:
    name: design rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      # DESIGN.md section 1: core/ is the portable layer. It must not reach
      # into the per-OS layer, the plugin layer or the hosting layer.
      - name: core/ does not depend on platform/, adapters/ or apps/
        run: |
          set -euo pipefail
          # Only source and headers - core/CMakeLists.txt deliberately
          # compiles the matching platform/ sources into the vc_core target.
          files=$(git ls-files 'core/*.h' 'core/*.cpp')
          if grep -nE '^[[:space:]]*#[[:space:]]*include[[:space:]]*["<](\.\./)*(platform|adapters|apps)/' $files; then
            echo "::error::core/ must not include from platform/, adapters/ or apps/ (DESIGN.md section 1)"
            exit 1
          fi
          echo "OK: core/ includes nothing from platform/, adapters/ or apps/"

      # DESIGN.md section 1 (insulation): a core/ header must compile on its
      # own against nothing but the standard library - no platform SDK, and no
      # reliance on being included after something else.
      - name: core/ headers compile standalone
        run: |
          set -euo pipefail
          fail=0
          for h in core/include/vc/*.h; do
            if ! g++-13 -std=c++23 -Icore/include -fsyntax-only -x c++ "$h" 2>/tmp/hdr.err; then
              echo "::error file=$h::header does not compile standalone (DESIGN.md section 1)"
              cat /tmp/hdr.err
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "OK: every core/ header compiles standalone"
          fi
          exit $fail

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        # Two constraints, both learned the hard way:
        #
        # clang and clang-tidy must be the SAME major version, because
        # clang-tidy uses clang's frontend.
        #
        # And libc++ is installed because clang-18 cannot provide
        # std::expected against this image's libstdc++: the header is present
        # but its feature guard evaluates false, so every vc::Result use
        # becomes an error even with -std=gnu++23 and __cplusplus == 202302L.
        # The build jobs use g++-13, which is unaffected; only this analysis
        # job needs libc++.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev \
                                  clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev

      - name: Configure (export compile commands)
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Diagnostic: if this job fails again, the flags actually in play are
      # the first thing to look at rather than something to guess about.
      - name: Show the recorded compile flags
        run: |
          python3 - <<'PY'
          import json
          db = json.load(open('build/compile_commands.json'))
          e = next(x for x in db if 'vc_common.cpp' in x['file'])
          cmd = e.get('command') or ' '.join(e['arguments'])
          print('compiler:', cmd.split()[0])
          print('std flags:', [t for t in cmd.split() if 'std' in t])
          PY
          echo "--- __cplusplus as clang-18 sees it with the same flag ---"
          echo '__cplusplus' | clang++-18 -std=gnu++23 -x c++ -E - | tail -1
          echo "--- does <expected> yield std::expected? ---"
          printf '#include <expected>\nstd::expected<int,int> e;\nint main(){}\n' > /tmp/x.cpp
          if clang++-18 -std=gnu++23 -stdlib=libc++ -fsyntax-only /tmp/x.cpp; then
            echo "OK: std::expected available under libc++"
          else
            echo "std::expected NOT available under libc++ either"
          fi
          # Never fail the run here; the point is evidence for the step below.
          exit 0

      - name: Run clang-tidy on the library
        run: |
          set -euo pipefail
          # apps/ is excluded: agent-win is Windows-only, and the hosts and
          # vc-selftest are glue where the checks report little of value.
          files=$(git ls-files 'core/*.cpp' 'adapters/*.cpp' 'platform/posix/*.cpp')
          echo "Analysing $(echo "$files" | wc -l) files"
          # -std is forced rather than left to the compilation database: the
          # last -std on the command line wins, so this holds even if the
          # recorded flag is lost or downgraded. Without C++23 the libstdc++
          # <expected> header compiles to nothing and every vc::Result use
          # becomes an error.
          # -stdlib=libc++ for the reason in the install step. -std is forced
          # too: the last -std on the command line wins, so this holds even if
          # the recorded flag is ever lost or downgraded.
          clang-tidy-18 --quiet -p build \
            --extra-arg=-std=c++23 --extra-arg=-stdlib=libc++ $files

  build-test:
    name: build & self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: vs2022
            build-flags: --config Release
            selftest: build/bin/Release/vc-selftest.exe
          - os: ubuntu-latest
            preset: ""
            build-flags: ""
            selftest: build/bin/vc-selftest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++-13

      - name: Configure (Windows / MSVC via preset)
        if: matrix.os == 'windows-2022'
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure (Linux / GCC 13)
        if: matrix.os == 'ubuntu-latest'
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build ${{ matrix.build-flags }} --parallel

      - name: Run self-test
        run: ${{ matrix.selftest }}
